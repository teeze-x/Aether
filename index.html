const SIGNAL_VALUE = { Bullish: 1, Neutral: 0, Bearish: -1 };
const SIGNAL_COLOR = { Bullish: "#3B82F6", Bearish: "#EF4444", Neutral: "#4B5563" };

function scoreLabel(score) {
  if (score >= 6) return "Very Bullish";
  if (score >= 2) return "Bullish";
  if (score > -2) return "Neutral";
  if (score > -6) return "Bearish";
  return "Very Bearish";
}

function categoryScore(items) {
  return items.reduce((s, i) => s + SIGNAL_VALUE[i.signal], 0);
}

function Gauge({ score, max }) {
  const clamped = Math.max(-max, Math.min(max, score));
  const angle = (clamped / max) * 90;
  return (
    <div className="gauge-wrap">
      <svg viewBox="0 0 200 110" className="gauge-svg">
        <defs>
          <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#EF4444" />
            <stop offset="50%" stopColor="#4B5563" />
            <stop offset="100%" stopColor="#3B82F6" />
          </linearGradient>
        </defs>
        <path d="M 15 100 A 85 85 0 0 1 185 100" fill="none" stroke="url(#gaugeGrad)" strokeWidth="14" strokeLinecap="round" opacity="0.85" />
        <g transform={`rotate(${angle} 100 100)`}>
          <line x1="100" y1="100" x2="100" y2="28" stroke="#FFB000" strokeWidth="3" className="needle" />
          <circle cx="100" cy="100" r="6" fill="#FFB000" />
        </g>
      </svg>
      <div className="gauge-score">{score > 0 ? `+${score}` : score}</div>
      <div className="gauge-label">{scoreLabel(score)}</div>
    </div>
  );
}

function Pill({ signal }) {
  return <span className="pill" style={{ background: SIGNAL_COLOR[signal] }}>{signal}</span>;
}

function MacroScorecard() {
  const [assetKey, setAssetKey] = useState("XAUUSD");
  const [data, setData] = useState(() => JSON.parse(JSON.stringify(ASSETS)));
  const [lastUpdated, setLastUpdated] = useState(new Date());
  const [liveStatus, setLiveStatus] = useState("loading");

  const asset = data[assetKey];

  useEffect(() => {
    let cancelled = false;
    setLiveStatus("loading");
    fetch(`${BACKEND_URL}/api/scorecard?asset=${assetKey}`)
      .then((r) => r.json())
      .then((json) => {
        if (cancelled) return;
        if (json.live) {
          setData((prev) => {
            const next = JSON.parse(JSON.stringify(prev));
            Object.entries(json.categories).forEach(([catName, items]) => {
              next[assetKey].categories[catName] = items;
            });
            return next;
          });
          setLiveStatus("live");
          setLastUpdated(new Date());
        } else {
          setLiveStatus("error");
        }
      })
      .catch(() => { if (!cancelled) setLiveStatus("error"); });
    return () => { cancelled = true; };
  }, [assetKey]);

  const categoryScores = useMemo(() => {
    const out = {};
    Object.entries(asset.categories).forEach(([name, items]) => { out[name] = categoryScore(items); });
    return out;
  }, [asset]);

  const overallScore = useMemo(() => Object.values(categoryScores).reduce((s, v) => s + v, 0), [categoryScores]);
  const maxOverall = useMemo(() => Object.values(asset.categories).reduce((s, items) => s + items.length, 0), [asset]);

  return (
    <div className="term-root">
      <style>{`
        .term-root { min-height: 100vh; background: #000000; color: #D7DBE3; font-family: 'Inter', sans-serif; padding: 20px 16px 48px; position: relative; overflow-x: hidden; }
        .term-root::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(255,176,0,0.015) 0px, rgba(255,176,0,0.015) 1px, transparent 1px, transparent 3px); z-index: 1; }
        .term-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; position: relative; z-index: 2; }
        .term-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.18em; color: #FFB000; text-transform: uppercase; }
        .term-sub { font-size: 11px; color: #5B6472; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
        .status-banner { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 8px 12px; border-radius: 4px; margin-bottom: 18px; line-height: 1.5; position: relative; z-index: 2; }
        .status-banner.live { color: #3B82F6; border: 1px solid rgba(59,130,246,0.35); background: rgba(59,130,246,0.06); }
        .status-banner.loading { color: #FFB000; border: 1px solid rgba(255,176,0,0.35); background: rgba(255,176,0,0.06); }
        .status-banner.error { color: #EF4444; border: 1px solid rgba(239,68,68,0.35); background: rgba(239,68,68,0.06); }
        .asset-row { display: flex; gap: 8px; margin-bottom: 18px; position: relative; z-index: 2; flex-wrap: wrap; }
        .asset-btn { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 7px 14px; border-radius: 4px; border: 1px solid #1E1E1E; background: #0A0A0A; color: #8891A0; cursor: pointer; transition: all 0.15s ease; }
        .asset-btn.active { border-color: #FFB000; color: #FFB000; background: rgba(255,176,0,0.08); }
        .panel { background: #0A0A0A; border: 1px solid #1E1E1E; border-radius: 8px; padding: 18px; margin-bottom: 14px; position: relative; z-index: 2; }
        .overall-panel { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .overall-name { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #E5E7EB; letter-spacing: 0.04em; }
        .overall-ticker { font-size: 11px; color: #5B6472; font-family: 'JetBrains Mono', monospace; margin-bottom: 8px; }
        .gauge-wrap { display: flex; flex-direction: column; align-items: center; }
        .gauge-svg { width: 220px; height: 122px; }
        .needle { transition: transform 0.6s cubic-bezier(.4,1.6,.4,1); filter: drop-shadow(0 0 4px rgba(255,176,0,0.8)); }
        .gauge-score { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #FFB000; margin-top: -10px; }
        .gauge-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8891A0; letter-spacing: 0.08em; text-transform: uppercase; }
        .updated-line { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #4B5563; margin-top: 10px; }
        .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .cat-name { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #E5E7EB; letter-spacing: 0.03em; }
        .cat-score { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 4px; letter-spacing: 0.03em; white-space: nowrap; }
        .col-header { display: grid; grid-template-columns: 1fr 60px 60px 64px 84px; gap: 10px; padding: 10px 0 6px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #4B5563; letter-spacing: 0.08em; text-transform: uppercase; }
        .col-header span:not(:first-child) { text-align: right; }
        .item-row { display: grid; grid-template-columns: 1fr 60px 60px 64px 84px; align-items: center; padding: 10px 0; border-top: 1px solid #1A1E2A; gap: 10px; }
        .item-name { font-size: 12.5px; color: #E5E7EB; font-weight: 500; }
        .item-prev, .item-curr, .item-change { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right; white-space: nowrap; }
        .item-prev { color: #6B7280; }
        .item-curr { color: #E5E7EB; font-weight: 600; }
        .item-change { font-weight: 600; }
        .item-change.up { color: #3B82F6; }
        .item-change.down { color: #EF4444; }
        .item-change.flat { color: #6B7280; }
        .pill { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #0B0E14; padding: 4px 0; border-radius: 3px; letter-spacing: 0.03em; white-space: nowrap; text-align: center; width: 84px; justify-self: end; }
        .footer-note { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #4B5563; text-align: center; margin-top: 20px; line-height: 1.6; position: relative; z-index: 2; }
      `}</style>

      <div className="term-header">
        <div>
          <div className="term-title">▲ Macro Scorecard</div>
          <div className="term-sub">live FRED + COT data</div>
        </div>
      </div>

      <div className={`status-banner ${liveStatus}`}>
        {liveStatus === "live"
          ? "🟢 LIVE — data pulled directly from FRED and CFTC COT feeds."
          : liveStatus === "loading"
          ? "⏳ Connecting to live data…"
          : "⚠️ Couldn't reach the backend right now. Try refreshing."}
      </div>

      <div className="asset-row">
        {Object.entries(data).map(([key, a]) => (
          <button key={key} className={"asset-btn" + (key === assetKey ? " active" : "")} onClick={() => setAssetKey(key)}>
            {a.label}
          </button>
        ))}
      </div>

      <div className="panel overall-panel">
        <div className="overall-name">{asset.name}</div>
        <div className="overall-ticker">{asset.label}</div>
        <Gauge score={overallScore} max={Math.max(maxOverall, 1)} />
        <div className="updated-line">last updated {lastUpdated.toLocaleTimeString()}</div>
      </div>

      {Object.entries(asset.categories).map(([catName, items]) => {
        const sc = categoryScores[catName];
        const color = sc > 0 ? "#3B82F6" : sc < 0 ? "#EF4444" : "#8891A0";
        const hasNumbers = items.some((i) => i.previous || i.current);
        return (
          <div className="panel" key={catName}>
            <div className="cat-header">
              <div className="cat-name">{catName}</div>
              <div className="cat-score" style={{ color, background: color + "22" }}>{sc > 0 ? `+${sc}` : sc} · {scoreLabel(sc)}</div>
            </div>
            {hasNumbers && (
              <div className="col-header">
                <span></span>
                <span>Prev</span>
                <span>Now</span>
                <span>Change</span>
                <span></span>
              </div>
            )}
            {items.map((item, i) => {
              const changeDir = (item.change || "").startsWith("+") ? "up" : (item.change || "").startsWith("-") ? "down" : "flat";
              return (
                <div className="item-row" key={i}>
                  <div className="item-name">{item.name}</div>
                  <div className="item-prev">{item.previous || ""}</div>
                  <div className="item-curr">{item.current || ""}</div>
                  <div className={`item-change ${changeDir}`}>{item.change && item.change !== "—" ? item.change : ""}</div>
                  <Pill signal={item.signal} />
                </div>
              );
            })}
          </div>
        );
      })}

      <div className="footer-note">
        Technicals is your own chart read — everything else pulls live from FRED and COT.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MacroScorecard />);
</script>

</html>
